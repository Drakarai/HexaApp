<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — HexaApp</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #070a13;
        color: #e6e9f5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
      p { color: #94a3b8; max-width: 22rem; line-height: 1.5; }
      button {
        margin-top: 1.5rem;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 0.6rem;
        background: #4f46e5;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <div style="font-size: 3rem">⬢</div>
      <h1>Sin conexión</h1>
      <p>
        HexaApp necesita internet para enseñarte los puntos, las muertes y las
        notas al día. Vuelve a intentarlo cuando recuperes cobertura.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
